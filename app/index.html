<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Hub</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; color: #f2f5f8; font-family: "SamsungOne", "Segoe UI", Arial, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  main[hidden] { display: none; }
  h1 { margin: 0 0 3vh; font-size: 3vw; font-weight: 600; }
  #address { box-sizing: border-box; width: 50vw; height: 4.4vw; line-height: 4.4vw; padding: 0 1.4vw; border-radius: 0.6vw; background: #18212b; font-size: 2.2vw; }
  #status { height: 2.2vw; margin: 1.6vh 0 2.4vh; font-size: 1.5vw; color: #9fb0c0; }
  .row { display: flex; justify-content: center; gap: 0.6vw; margin-bottom: 0.6vw; }
  .key { box-sizing: border-box; min-width: 4.4vw; height: 4.4vw; line-height: 4.4vw; padding: 0 1vw; border-radius: 0.5vw; background: #18212b; font-size: 1.8vw; text-align: center; }
  .key.focused { background: #f2f5f8; color: #0b0f14; }
</style>
</head>
<body>
<main id="connect" hidden>
  <h1>Connect to your PC</h1>
  <div id="address"></div>
  <div id="status"></div>
  <div id="keys"></div>
</main>
<script>
  var PC_URL_KEY = 'pc-url';
  var BUNDLE_KEY = 'hub-bundle';
  var VERSION_KEY = 'hub-version';
  var SHOW_CONNECT_KEY = 'show-connect';
  var DEFAULT_PORT = '8770';
  var REQUEST_TIMEOUT_MS = 8000;
  var RETRY_MS = 5000;
  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, RETURN: 10009 };
  var ROWS = [
    '1234567890'.split(''),
    'qwertyuiop'.split(''),
    'asdfghjkl'.split(''),
    'zxcvbnm.-:'.split(''),
    ['Delete', 'Connect']
  ];

  var address = '';
  var row = 0;
  var col = 0;
  var retryTimer = null;
  var attempt = 0;

  function read(key) {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  function render() {
    document.getElementById('address').textContent = address;
    var keys = document.getElementById('keys');
    keys.innerHTML = '';
    ROWS.forEach(function (labels, rowIndex) {
      var rowEl = document.createElement('div');
      rowEl.className = 'row';
      labels.forEach(function (label, colIndex) {
        var key = document.createElement('div');
        key.className = 'key' + (rowIndex === row && colIndex === col ? ' focused' : '');
        key.textContent = label;
        rowEl.appendChild(key);
      });
      keys.appendChild(rowEl);
    });
  }

  function baseUrl(value) {
    return 'http://' + value + (value.indexOf(':') === -1 ? ':' + DEFAULT_PORT : '');
  }

  function addressFrom(url) {
    return url.replace('http://', '').replace(':' + DEFAULT_PORT, '');
  }

  function stopTrying() {
    attempt += 1;
    clearTimeout(retryTimer);
  }

  function fetchText(url, signal) {
    return fetch(url, { cache: 'no-store', signal: signal }).then(function (res) {
      if (!res.ok) throw new Error('Bad response');
      return res.text();
    });
  }

  function connect(value) {
    stopTrying();
    var thisAttempt = attempt;
    var url = baseUrl(value);
    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);
    setStatus('Connecting...');

    Promise.all([fetchText(url + '/__version', controller.signal), fetchText(url + '/__bundle', controller.signal)])
      .then(function (results) {
        clearTimeout(timeout);
        if (thisAttempt !== attempt) return;
        localStorage.setItem(PC_URL_KEY, url);
        localStorage.setItem(VERSION_KEY, results[0]);
        localStorage.setItem(BUNDLE_KEY, results[1]);
        localStorage.removeItem(SHOW_CONNECT_KEY);
        location.reload();
      })
      .catch(function () {
        clearTimeout(timeout);
        if (thisAttempt !== attempt) return;
        setStatus('Can\'t reach ' + value + '. Trying again...');
        retryTimer = setTimeout(function () { connect(value); }, RETRY_MS);
      });
  }

  function pressFocusedKey() {
    var label = ROWS[row][col];
    if (label === 'Connect') {
      if (address) connect(address);
      return;
    }
    stopTrying();
    setStatus('');
    address = label === 'Delete' ? address.slice(0, -1) : address + label;
  }

  function moveRow(step) {
    var next = row + step;
    if (next < 0 || next >= ROWS.length) return;
    row = next;
    col = Math.min(col, ROWS[row].length - 1);
  }

  function goBackToSavedHub() {
    try {
      localStorage.removeItem(SHOW_CONNECT_KEY);
      location.reload();
    } catch (e) { /* Storage is unavailable. */ }
  }

  function onKey(event) {
    var code = event.keyCode;
    if (code === KEY.RETURN) {
      if (read(BUNDLE_KEY)) goBackToSavedHub();
      return;
    }
    if (code === KEY.LEFT) col = Math.max(0, col - 1);
    else if (code === KEY.RIGHT) col = Math.min(ROWS[row].length - 1, col + 1);
    else if (code === KEY.UP) moveRow(-1);
    else if (code === KEY.DOWN) moveRow(1);
    else if (code === KEY.ENTER) pressFocusedKey();
    else return;
    render();
  }

  function showConnectScreen() {
    var savedUrl = read(PC_URL_KEY);
    document.getElementById('connect').hidden = false;
    document.addEventListener('keydown', onKey);
    address = savedUrl ? addressFrom(savedUrl) : '';
    render();
    if (address && !read(SHOW_CONNECT_KEY)) connect(address);
  }

  function runSavedHub(bundle) {
    document.open();
    document.write(bundle);
    document.close();
  }

  window.addEventListener('load', function () {
    var bundle = read(BUNDLE_KEY);
    if (bundle && !read(SHOW_CONNECT_KEY)) runSavedHub(bundle);
    else showConnectScreen();
  });
</script>
</body>
</html>
